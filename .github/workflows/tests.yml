name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/requirements-controller.txt
      - run: python -m pip install -r runtime/requirements-controller.txt pytest
      - run: sha256sum -c skills/MANIFEST.sha256
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q runtime/tests
